name: Verified local release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify release is from master and version matches
        env:
          TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/master
          python -c 'import os,tomllib; p=tomllib.load(open("pyproject.toml","rb")); assert os.environ["TAG"] == "v"+p["project"]["version"]'
      - name: Install and verify
        run: |
          python -m pip install uv
          uv sync --locked
          uv run python data/download.py
          uv run pytest tests local_tests
      - name: Build distribution artifacts
        run: |
          uv build --wheel --out-dir dist
          uv run python tools/build_release.py
          unzip -t dist/code.zip
          cd dist && sha256sum --check SHA256SUMS
      - name: Verify installed CLI outside the checkout
        run: |
          python -m venv /tmp/cardinal-release-test
          /tmp/cardinal-release-test/bin/pip install dist/*.whl
          cd /tmp
          /tmp/cardinal-release-test/bin/cardinal --version
          /tmp/cardinal-release-test/bin/cardinal --home /tmp/cardinal-demo init --demo
          /tmp/cardinal-release-test/bin/cardinal --home /tmp/cardinal-demo demo onboarding
      - name: Publish preview release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/code.zip dist/*.whl dist/SHA256SUMS dist/release-manifest.json --verify-tag --prerelease --title "Cardinal Agent $TAG" --notes-file RELEASE_NOTES.md
