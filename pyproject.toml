[project]
name = "cardinal-agent"
version = "0.1.1"
description = "Local employee assistant with source-aware retrieval, memory, and approved terminal tools"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.0",
    "jsonschema>=4.20",
    "pytest>=8.0",
    "numpy>=2.0",
]

[project.scripts]
cardinal = "cardinal_agent.app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cardinal_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live' -q"
markers = [
    "live: makes real LLM calls (run with `uv run pytest -m live`)",
]
